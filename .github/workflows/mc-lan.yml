name: Build McLan

on:
  push:
    paths: [mc-lan/**, .github/workflows/mc-lan.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: mc-lan\build.bat
        shell: cmd
      - shell: pwsh
        run: if (!(Test-Path mc-lan\McLan.exe)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: McLan
          path: mc-lan/McLan.exe
